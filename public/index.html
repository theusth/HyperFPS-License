<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperFPS Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#08030f;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.card{background:#12081d;border:1px solid #7820ae;border-radius:18px;padding:26px;box-shadow:0 0 40px #5a00a733}.login{max-width:450px;margin:100px auto;text-align:center}input,select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #5f247d;background:#0c0612;color:#fff;margin:7px 0}button{background:linear-gradient(90deg,#7415e8,#b724ef);border:0;font-weight:800;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto;padding:10px 18px}.msg{min-height:22px;color:#ffb0d8}.user{padding:12px;border:1px solid #3c174f;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.user button{width:auto;margin:2px;padding:8px 10px}.key{color:#d69bff;word-break:break-all;font-family:monospace}</style></head><body>
<div class="wrap"><section id="login" class="card login"><h1>⚡ HyperFPS Admin</h1><p>Digite o ADMIN_TOKEN configurado no arquivo .env.</p><input id="token" type="password" placeholder="Token administrativo"><button onclick="enter()">ENTRAR</button><div id="loginMsg" class="msg"></div></section>
<section id="panel" class="hidden"><div class="top"><h1>HyperFPS Admin</h1><button onclick="logout()">SAIR</button></div><div class="card"><h2>Criar usuário</h2><div class="grid"><input id="username" placeholder="Usuário"><input id="password" type="password" placeholder="Senha (mínimo 8)"><input id="email" placeholder="E-mail (opcional)"><select id="plan"><option>Premium</option><option>Mensal</option><option>Vitalício</option></select><input id="days" type="number" placeholder="Dias (vazio = sem expiração)"></div><button onclick="createUser()">GERAR USUÁRIO E KEY</button><div id="createMsg" class="msg"></div><div id="newKey" class="key"></div></div><br><div class="card"><div class="top"><h2>Usuários</h2><button onclick="loadUsers()">ATUALIZAR</button></div><div id="users"></div></div></section></div>
<script>
let adminToken=sessionStorage.getItem('hyperfps-admin-token')||'';
const headers=()=>({'Content-Type':'application/json','x-admin-token':adminToken});
async function enter(){adminToken=document.getElementById('token').value.trim();try{const r=await fetch('/api/admin/users',{headers:headers()});const j=await r.json();if(!r.ok)throw new Error(j.message||'Falha');sessionStorage.setItem('hyperfps-admin-token',adminToken);showPanel();renderUsers(j.users);}catch(e){document.getElementById('loginMsg').textContent=e.message}}
function showPanel(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden')}
function logout(){sessionStorage.clear();location.reload()}
async function loadUsers(){const r=await fetch('/api/admin/users',{headers:headers()});const j=await r.json();if(r.ok)renderUsers(j.users);else alert(j.message)}
function renderUsers(users=[]){document.getElementById('users').innerHTML=users.length?users.map(u=>`<div class="user"><div><b>${u.username}</b> — ${u.plan||'-'}<br><small>Status: ${u.status} | HWID: ${u.hwid_hash?'Vinculado':'Livre'}</small></div><div><button onclick="resetHwid('${u.id}')">Reset HWID</button><button onclick="toggleStatus('${u.id}','${u.status==='active'?'blocked':'active'}')">${u.status==='active'?'Bloquear':'Ativar'}</button></div></div>`).join(''):'Nenhum usuário.'}
async function createUser(){const body={username:username.value,password:password.value,email:email.value||null,plan:plan.value,days:days.value||null};const r=await fetch('/api/admin/users',{method:'POST',headers:headers(),body:JSON.stringify(body)});const j=await r.json();createMsg.textContent=j.message||'';newKey.textContent=r.ok?'KEY GERADA: '+j.licenseKey:'';if(r.ok)loadUsers()}
async function resetHwid(id){const r=await fetch('/api/admin/users/'+id+'/reset-hwid',{method:'POST',headers:headers()});const j=await r.json();alert(j.message||'Concluído');loadUsers()}
async function toggleStatus(id,status){const r=await fetch('/api/admin/users/'+id+'/status',{method:'PATCH',headers:headers(),body:JSON.stringify({status})});const j=await r.json();if(!r.ok)alert(j.message);loadUsers()}
if(adminToken)enter();
</script></body></html>
